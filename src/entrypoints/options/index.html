<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark" />
    <!--
      No `manifest.open_in_tab`: the settings open in the browser's embedded dialog,
      where they stay next to the extension you were looking at instead of taking over
      a tab. The form is laid out to fit that dialog — see App.svelte.

      If it ever has to move to a tab, it goes here as a meta tag and nowhere else. WXT
      builds `options_ui` from this entrypoint's own meta tags and assigns the whole
      object, so the same key set in `wxt.config.ts` is overwritten without a word.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings — Tilt Breaker</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
