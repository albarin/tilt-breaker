<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark" />
    <!--
      In a tab rather than the small embedded dialog: settings is a full form.

      It has to be declared here and nowhere else. WXT builds `options_ui` from the
      entrypoint's own meta tags and assigns the whole object, so the same key set in
      `wxt.config.ts` is overwritten without a word and silently defaults to false.
    -->
    <meta name="manifest.open_in_tab" content="true" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings — Tilt Breaker</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
